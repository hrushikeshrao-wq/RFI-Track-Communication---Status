# Builds the static export and publishes it to GitHub Pages. This branch is
# the one linked from the Shareable links section, so a push here publishes
# the preview. The base path is the lowercased repo name, which is the path
# GitHub Pages actually serves.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - RFI-Track-Communication---Status-V1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set Pages base path
        run: echo "NEXT_PUBLIC_BASE_PATH=/$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo the first time this runs.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
