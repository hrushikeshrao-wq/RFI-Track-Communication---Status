# Builds the static export and publishes it to GitHub Pages on every push to
# main. The base path comes from the Pages site itself: a project site on
# github.io lives under "/<repo-name>", while a private/org Pages site is
# served from the root of its own host. So forks, clones and moves of this
# prototype all deploy correctly without edits.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4
      - uses: chainguard-actions/pnpm-action-setup@55cb2ce0b5b539c43e25408829527813a667ff5e # v4.4.0
      - uses: chainguard-actions/actions-setup-node@031fc9bd73e651da81e6a7294b2af29e64d5f39c # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: chainguard-actions/actions-configure-pages@cc7d71013bf772c361007a6610d657165f4a8254 # v5.0.0
        with:
          # Turns Pages on for the repo the first time this runs.
          enablement: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Empty when the site is served from a host root.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: chainguard-actions/actions-upload-pages-artifact@e2c4c7670c215010f2d293cce333c0ec3e87f47a # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: chainguard-actions/actions-deploy-pages@f4d5c29b63bb3df1e6eac647993dd0c3fe33651c # v4.0.5
