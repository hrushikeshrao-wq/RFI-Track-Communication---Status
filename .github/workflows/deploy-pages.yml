# Builds the static export and publishes it to GitHub Pages on every push to
# main. The base path comes from the Pages site itself: a project site on
# github.io lives under "/<repo-name>", while a private/org Pages site is
# served from the root of its own host. So forks, clones and moves of this
# prototype all deploy correctly without edits.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo the first time this runs.
          enablement: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Empty when the site is served from a host root.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
